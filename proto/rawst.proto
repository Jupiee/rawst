syntax = "proto3";

package rawstproto;

message DownloadArgs {
    optional uint32 threads = 1;
    optional string input = 2;
    repeated string output_file_path = 3;
    optional string headers_file_path = 4;
}

message ResumeArgs {
    repeated string download_ids = 1;
}

message HistoryArgs {
    bool show = 1;
    bool clear = 2;
}

message Request {
    string argument_type = 1;

    oneof command_args {
        DownloadArgs download_args = 2;
        ResumeArgs resume_args = 3;
        HistoryArgs history_args = 4;
    };

    string color = 5;
    optional string log_verbosity = 6;
    optional string verbosity = 7;
}

message Response {
    string output = 1;
}

service RawstDownload {
    rpc Send(Request) returns (Response);
}