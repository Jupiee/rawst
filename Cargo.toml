[package]
name = "rawst_dl"
version = "0.8.1"
authors = ["Faseeh Shahzad"]
description = "Snag your files efficiently with Rawst downloader"
repository = "https://github.com/Jupiee/rawst"
license = "GPL-3.0"
readme = "README.md"
edition = "2024"
default-run = "rawst"
include = ["src/**/*"]
categories = ["command-line-utilities", "network-programming", "asynchronous"]
keywords = ["cli", "async", "http", "network", "download-manager"]

[dependencies]
base64 = "0.22.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["cargo", "derive"] }
clap-num = "1.2.0"
clap_complete = "4.6.2"
concolor-clap = "0.1.0"
directories = "6.0.0"
fern = { version = "0.7.1", features = ["chrono", "colored"] }
futures = "0.3.32"
hex = "0.4.3"
humantime = "2.3.0"
indicatif = "0.18.4"
iri-string = { version = "0.7.12", features = ["serde"] }
log = "0.4.29"
reqwest = {version= "0.13.2", default-features = false, features = ["stream", "rustls", "cookies"]}
serde = {version= "1.0.219", features = ["derive"]}
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = {version= "1.52.1", features = ["full"]}
toml = "0.8.20"

[profile.dev]
debug = 0
strip = "debuginfo"
opt-level = 1  # Use slightly better optimizations. Reduces ./target/debug size.

[profile.release]
opt-level = "s"
codegen-units = 1
lto= "fat"
